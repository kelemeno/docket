<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%232a78d6'/%3E%3Cpath d='M30 52l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/docket.css">
<style>
.modes { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--bg); border-bottom: 1px solid var(--border); }
.modes .name { font-weight: 600; }
.modes .status { margin-left: auto; text-align: right; }
</style>
</head>
<body>
<nav class="modes">
  <span class="name">Docket</span>
  <span class="status meta" id="status"></span>
  <button id="run" title="Read what's new now (r)">Refresh</button>
</nav>
<div class="docket" id="view"></div>

<script src="/esc.js"></script>
<script src="/docket.js"></script>
<script src="/page.js"></script>
<script>
const $ = (id) => document.getElementById(id);
docketPage($("view"), { status: $("status"), run: $("run") });
</script>
</body>
</html>
